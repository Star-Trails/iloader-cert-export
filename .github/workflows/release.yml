name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.99.1'
      - name: Test
        run: go test ./...
      - name: Build export helper
        run: cargo build --release --locked --manifest-path helper/Cargo.toml
      - name: Build native app
        run: go run github.com/egoist/mygo/cmd/mygo@v0.7.3 build -platform windows/amd64
      - name: Package release files
        shell: pwsh
        run: |
          $package = 'release/iloader-cert-export-windows-x64'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item 'dist/windows-amd64/iloader-cert-export.exe' $package
          Copy-Item 'helper/target/release/iloader-cert-helper.exe' $package
          Copy-Item LICENSE $package
          Copy-Item 'helper/LICENSE' "$package/iloader-export-LICENSE"
          $zip = 'release/iloader-cert-export-windows-x64.zip'
          Compress-Archive -Path "$package/*" -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  iloader-cert-export-windows-x64.zip" | Set-Content -Encoding ascii 'release/SHA256SUMS.txt'
      - name: Publish immutable release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" --verify-tag --draft --title "$env:GITHUB_REF_NAME" --notes-file .github/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload "$env:GITHUB_REF_NAME" release/iloader-cert-export-windows-x64.zip release/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "$env:GITHUB_REF_NAME" --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $immutable = gh release view "$env:GITHUB_REF_NAME" --json isImmutable --jq '.isImmutable'
          if ($LASTEXITCODE -ne 0 -or $immutable -ne 'true') { throw 'The published release is not immutable; check the repository setting.' }
